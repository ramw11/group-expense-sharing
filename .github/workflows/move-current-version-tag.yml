name: Move current version tag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/move-current-version-tag.yml

permissions:
  contents: write

jobs:
  move-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Move v1.0.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request PATCH \
            --url "https://api.github.com/repos/ramw11/group-expense-sharing/git/refs/tags/v1.0.0" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"sha":"546ce0b51f9a25232886d6bef09ab4a7512ed004","force":true}'
