name: Create current version tag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/create-current-version-tag.yml

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.0.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --url "https://api.github.com/repos/ramw11/group-expense-sharing/git/refs" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"refs/tags/v1.0.0","sha":"30db5d87da68e9ee44bd969868e22c4d0c2c260c"}'
